name: Derleme

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - run: mv app/build/outputs/apk/release/app-release.apk kopru.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kopru-android
          path: android/kopru.apk

  macos:
    name: macOS istemcisi
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: mac/go.mod
          cache-dependency-path: mac/go.sum
      - run: go vet ./... && go test ./...
      - run: make
      - run: cd ../dist && zip kopru-macos.zip kopru
      - uses: actions/upload-artifact@v4
        with:
          name: kopru-macos
          path: dist/kopru-macos.zip

  release:
    name: Sürüm yayınla
    # main'e her push'ta android/app/build.gradle.kts içindeki versionName ile
    # (ör. v0.1.0) bir sürüm oluşturulur ya da mevcut sürümün dosyaları güncellenir.
    if: github.event_name == 'push'
    needs: [android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            v=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
            echo "tag=v$v" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Köprü ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            Android uygulaması (`kopru.apk`) ve macOS istemcisi (`kopru-macos.zip`, Intel + Apple Silicon).
            Kurulum adımları için README'ye bakın.
          files: |
            kopru.apk
            kopru-macos.zip
